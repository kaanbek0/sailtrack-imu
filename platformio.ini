; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:SensorNode]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
build_src_filter = +<SensorNode.cpp>
lib_deps = 
	adafruit/Adafruit AHRS@^2.3.2
	adafruit/Adafruit LSM9DS1 Library@^2.1.1
	https://github.com/sandeepmistry/arduino-CAN
	mikalhart/TinyGPSPlus@^1.1.0
build_flags = 
	-D BOARD_HAS_PSRAM

[env:RadioHead]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
lib_deps = 
	https://github.com/sandeepmistry/arduino-CAN
build_src_filter = +<RadioHead.cpp> -<SensorNode.cpp>

[env:DisplayNode]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
build_flags = 
    -D ESP32
lib_deps = 
    zinggjm/GxEPD2 @ ^1.5.5
    adafruit/Adafruit GFX Library @ ^1.11.9
	https://github.com/sandeepmistry/arduino-CAN
build_src_filter = +<display.cpp> -<RadioHead.cpp> -<SensorNode.cpp>

[env:gps_test]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
build_src_filter = +<gps_test.cpp>



[env:epd_slpeep]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
build_src_filter = +<epd_sleep.cpp>

[env:MotionCal]
platform = espressif32
board = ttgo-t7-v14-mini32
framework = arduino
monitor_speed = 115200
build_src_filter = +<MotionCal.cpp>
lib_deps = 
	adafruit/Adafruit AHRS@^2.3.2
	adafruit/Adafruit LSM9DS1 Library@^2.1.1
